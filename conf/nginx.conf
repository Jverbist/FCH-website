server {
  listen 80;
  server_name _;

  # Whole repo is mounted here by Compose
  root /var/www/html;
  index index.php index.html;

  # Make the demo the landing page
  location = / {
    return 302 /fake-NMBS/login.php;
  }

  # Serve the demo from /fake-NMBS (note: alias!)
  location /fake-NMBS/ {
    alias /var/www/html/fake-NMBS/;
    index index.php;

    # try actual file/dir, else fall back to login
    try_files $uri $uri/ /fake-NMBS/login.php?$args;

    # PHP inside this alias needs SCRIPT_FILENAME = real file path
    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $request_filename;
      fastcgi_pass php:9000;
    }
  }

  # Optional: block the real NMBS tree so you don’t fall into it
  location /NMBS/ { return 404; }

  # Generic PHP handler for anything else you keep around
  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_pass php:9000;
  }

  # Static assets
  location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    access_log off;
    expires 7d;
  }
}

